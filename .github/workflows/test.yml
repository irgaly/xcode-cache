name: Test

on:
  push:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: npm
      - run: npm install
      - shell: bash -xeu {0}
        run: npm run build
